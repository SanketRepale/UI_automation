version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: fieldnotes-postgres
    environment:
      POSTGRES_DB: fieldnotes_qa
      POSTGRES_USER: fieldnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnotes -d fieldnotes_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queue (RQ/Celery)
  redis:
    image: redis:7-alpine
    container_name: fieldnotes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldnotes-api
    environment:
      DATABASE_URL: postgresql+psycopg2://fieldnotes:${POSTGRES_PASSWORD:-changeme}@postgres:5432/fieldnotes_qa
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EXECUTION_ENABLED: "true"
      ENVIRONMENT: production
      TARGET_URL: ${TARGET_URL:-}
      TARGET_USERNAME: ${TARGET_USERNAME:-}
      TARGET_PASSWORD: ${TARGET_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Background worker for Playwright execution
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldnotes-worker
    environment:
      DATABASE_URL: postgresql+psycopg2://fieldnotes:${POSTGRES_PASSWORD:-changeme}@postgres:5432/fieldnotes_qa
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EXECUTION_ENABLED: "true"
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "-m", "ui_automation.worker"]

  # Frontend (Next.js) - development
  web-dev:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: fieldnotes-web-dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data: