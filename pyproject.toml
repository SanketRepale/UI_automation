[project]
name = "ui-automation-workbench"
version = "0.1.0"
description = "Skill-based AI-assisted UI test automation workbench"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
